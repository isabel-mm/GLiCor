<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Red de relaciones | GLiCor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/glossary.css?v=20261001k">
<style>
:root {
  --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
}
.network-hero { padding-bottom: 3.5rem; }
.network-hero h1 { font-size: clamp(2rem, 5vw, 2.7rem); line-height: 1.1; margin-bottom: 0.65rem; }
.network-hero p { max-width: 700px; margin: 0 auto 1.4rem; color: #cbd5e1; }

.search-row { max-width: 640px; margin: 0 auto; }
.search-row input {
  width: 100%; padding: 0.85rem 1rem; border-radius: 12px; border: 1px solid rgba(255,255,255,0.15);
  background: rgba(255,255,255,0.08); color: #fff; font: inherit; font-size: 1rem; outline: none; transition: 0.3s;
}
.search-row input::placeholder { color: #94a3b8; }
.search-row input:focus { border-color: #a855f7; background: rgba(255,255,255,0.14); }
.quick { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.45rem; margin-top: 0.9rem; }
.quick button { border: 1px solid rgba(255,255,255,0.18); background: transparent; color: #cbd5e1; border-radius: 999px; padding: 0.3rem 0.8rem; font: inherit; font-size: 0.8rem; font-weight: 600; cursor: pointer; transition: 0.2s; }
.quick button:hover { color: #fff; border-color: #f43f5e; }

.network-layout { max-width: 1240px; margin: -1.5rem auto 4rem; padding: 0 1.25rem; display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 1rem; position: relative; }
.network-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; box-shadow: var(--shadow); }

/* Lienzo */
.canvas-panel { overflow: hidden; display: flex; flex-direction: column; }
.trail { display: flex; flex-wrap: wrap; align-items: center; gap: 0.35rem; padding: 0.8rem 1.1rem; border-bottom: 1px solid var(--border); background: #fbfaff; font-size: 0.8rem; color: var(--text-muted); min-height: 2.9rem; }
.trail button { border: 0; background: none; color: #4f46e5; font: inherit; font-weight: 700; cursor: pointer; padding: 0; }
.trail button:hover { color: #f43f5e; }
.trail .sep { color: #cbd5e1; }
.trail .current { color: var(--text-main); font-weight: 700; }
#graph { display: block; width: 100%; height: auto; }
#graph .fade { animation: graph-fade 0.35s ease both; }
@keyframes graph-fade { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { #graph .fade { animation: none; } }
.edge { stroke: #cbd5e1; stroke-width: 2; fill: none; transition: stroke 0.15s, stroke-width 0.15s; }
.edge.in { stroke: #e2e8f0; stroke-dasharray: 5 5; stroke-width: 1.5; }
.edge.hot { stroke: #a855f7; stroke-width: 3; stroke-dasharray: none; }
.node { cursor: pointer; outline: none; }
.node rect { fill: #fff; stroke-width: 2; transition: fill 0.15s; }
.node text { font: 600 14px var(--font-main); fill: #334155; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.node.in rect { stroke-opacity: 0.55; }
.node.in text { fill: #64748b; font-size: 12.5px; }
.node:hover rect, .node.hot rect { fill: #faf5ff; }
.node:focus-visible rect { stroke-width: 3.5; }
.node.center { cursor: default; }
.node.center rect { fill: #1e1b4b; stroke: none; }
.node.center text { font: 800 18px var(--mono); fill: #fff; letter-spacing: -0.03em; }
.caption { min-height: 4.2rem; padding: 0.8rem 1.1rem; border-top: 1px solid var(--border); font-size: 0.86rem; color: #475569; background: #fbfaff; }
.caption strong { color: var(--text-main); }
.caption .hint { color: #94a3b8; }
.legend { display: flex; flex-wrap: wrap; gap: 0.4rem 1rem; padding: 0.7rem 1.1rem; border-top: 1px solid var(--border); font-size: 0.75rem; color: var(--text-muted); }
.legend span { display: inline-flex; align-items: center; gap: 0.35rem; }
.legend i { width: 0.7rem; height: 0.7rem; border-radius: 50%; display: inline-block; }
.legend .line { width: 1.4rem; height: 0; border-radius: 0; border-top: 2px solid #cbd5e1; }
.legend .line.dash { border-top: 2px dashed #cbd5e1; }

/* Ficha lateral */
.side { padding: 1.4rem; align-self: start; position: sticky; top: 4.5rem; max-height: calc(100vh - 5.5rem); overflow-y: auto; }
.side .cat-badge { margin-bottom: 0.7rem; }
.side h2 { font-family: var(--mono); font-size: 1.45rem; font-weight: 800; letter-spacing: -0.04em; line-height: 1.2; }
.side h2 .br { color: #6366f1; font-weight: 500; }
.side .equiv { color: #db2777; font-family: var(--mono); font-size: 0.92rem; font-weight: 500; margin-bottom: 0.8rem; padding-left: 0.85em; }
.side .def { font-size: 0.88rem; color: #475569; margin-bottom: 0.9rem; }
.open-entry { display: inline-block; font-size: 0.84rem; font-weight: 700; color: #4f46e5; text-decoration: none; margin-bottom: 1.2rem; }
.open-entry:hover { color: #f43f5e; }
.side h3 { font-size: 0.72rem; color: #a855f7; text-transform: uppercase; letter-spacing: 0.06em; margin: 0.4rem 0 0.6rem; border-bottom: 2px solid #f3e8ff; padding-bottom: 4px; }
.rel-list { list-style: none; display: grid; gap: 0.2rem; margin-bottom: 1rem; }
.rel-list li { padding: 0.45rem 0.55rem; border-radius: 10px; font-size: 0.82rem; color: #475569; cursor: pointer; transition: background 0.15s; }
.rel-list li:hover, .rel-list li.hot { background: #f5f3ff; }
.rel-list li b { display: block; color: var(--text-main); font-size: 0.88rem; }
.chips { display: flex; flex-wrap: wrap; gap: 0.35rem; }
.chips button { border: 1px solid #ddd6fe; background: #f5f3ff; color: #7c3aed; border-radius: 999px; padding: 0.2rem 0.65rem; font: inherit; font-size: 0.76rem; font-weight: 600; cursor: pointer; }
.chips button:hover { background: #7c3aed; color: #fff; }
.more { font-size: 0.76rem; color: var(--text-muted); margin-top: 0.4rem; }
.net-tools { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 0.5rem; padding: 0.7rem 1.1rem; border-top: 1px solid var(--border); font-size: 0.78rem; color: var(--text-muted); }
.net-tools button { border: 1px solid var(--border); background: #fff; color: #4f46e5; border-radius: 999px; padding: 0.3rem 0.85rem; font: inherit; font-weight: 700; cursor: pointer; transition: 0.2s; }
.net-tools button:hover { border-color: #a855f7; color: #f43f5e; }
.network-error { padding: 2rem; color: var(--text-muted); text-align: center; }

@media (max-width: 960px) {
  .network-layout { grid-template-columns: 1fr; }
  .side { position: static; max-height: none; }
}
@media (max-width: 620px) { .network-layout { padding: 0 0.7rem; } }
</style>
</head>
<body data-page="redes">
<script src="assets/js/navbar.js?v=20261001k"></script>

<header class="hero network-hero">
  <h1 data-es="Red de relaciones entre términos" data-en="Term relations network">Red de relaciones entre términos</h1>
  <p data-es="Elige un término y explora con qué conceptos se relaciona. Pulsa cualquier nodo para ponerlo en el centro." data-en="Choose a term and explore the concepts it relates to. Click any node to bring it to the centre.">Elige un término y explora con qué conceptos se relaciona. Pulsa cualquier nodo para ponerlo en el centro.</p>
  <div class="search-row">
    <input type="search" id="network-search" list="network-term-list" autocomplete="off" placeholder="Buscar término o recurso…">
    <datalist id="network-term-list"></datalist>
  </div>
  <div class="quick" id="network-quick"></div>
</header>

<main class="network-layout">
  <section class="network-panel canvas-panel">
    <nav class="trail" id="network-trail" aria-label="Recorrido"></nav>
    <svg id="graph" viewBox="0 0 1200 680" role="img" aria-label="Red de relaciones"></svg>
    <div class="caption" id="network-caption" aria-live="polite"></div>
    <div class="legend" id="network-legend"></div>
    <div class="net-tools" id="network-tools"></div>
  </section>
  <aside class="network-panel side" id="network-side"></aside>
</main>

<script src="assets/js/networks.js?v=20261001k"></script>
<script src="assets/js/footer.js?v=20261001k"></script>
</body>
</html>

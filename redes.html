<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redes conceptuales | GLiCor</title>
<link rel="stylesheet" href="assets/css/glossary.css?v=20260929d">
<style>
.network-hero { padding: 7rem 1.5rem 3.5rem; text-align: center; background: #1e1b4b; color: #fff; border-bottom: 4px solid; border-image: var(--primary-gradient) 1; }
.network-hero h1 { font-size: clamp(2rem, 5vw, 2.7rem); line-height: 1.1; margin-bottom: .65rem; }
.network-hero p { max-width: 700px; margin: 0 auto; color: #cbd5e1; }
.network-page { max-width: 1160px; margin: -1.5rem auto 4rem; padding: 0 1.25rem; position: relative; }
.network-panel { overflow: hidden; background: #fff; border: 1px solid var(--border); border-radius: 18px; box-shadow: var(--shadow); }
.network-tabs { display: flex; flex-wrap: wrap; gap: .55rem; padding: 1rem 1.2rem; border-bottom: 1px solid var(--border); background: #fbfaff; }
.network-tab { border: 1px solid #e2e8f0; background: #fff; color: #475569; border-radius: 999px; padding: .55rem 1rem; font: inherit; font-size: .84rem; font-weight: 700; cursor: pointer; transition: .2s; }
.network-tab:hover { border-color: #c4b5fd; color: #6d28d9; }
.network-tab.active { background: #1e1b4b; color: #fff; border-color: #1e1b4b; box-shadow: 0 3px 10px #1e1b4b26; }
.network-heading { display: flex; justify-content: space-between; align-items: end; gap: 1rem; padding: 1.25rem 1.5rem .25rem; }
.network-heading h2 { color: #1e1b4b; font-size: 1.25rem; }
.network-heading p { margin: .2rem 0 0; color: #64748b; font-size: .9rem; }
.network-help { flex: 0 0 auto; color: #64748b; font-size: .78rem; }
.network-canvas { padding: .4rem .7rem .8rem; overflow-x: auto; }
.network-canvas svg { display: block; width: 100%; min-width: 680px; height: auto; }
.network-edge { stroke: #cbd5e1; stroke-width: 2; }
.network-edge.association { stroke: #94a3b8; }
.network-node { cursor: pointer; outline: none; }
.network-node rect { fill: #fff; stroke: #dbe2ee; stroke-width: 1.5; transition: .2s; }
.network-node text { text-anchor: middle; fill: #334155; font: 600 14px system-ui, sans-serif; pointer-events: none; }
.network-node:hover rect, .network-node:focus rect { stroke: #8b5cf6; stroke-width: 2.5; fill: #faf5ff; }
.network-node.core rect { fill: #1e1b4b; stroke: #1e1b4b; }
.network-node.core text { fill: white; font-weight: 750; }
.network-node.measure rect { fill: #f5f3ff; stroke: #c4b5fd; }
.network-node.measure text { fill: #5b21b6; }
.network-node.type-a rect { fill: #f5f3ff; stroke: #c4b5fd; }
.network-node.type-b rect { fill: #fdf2f8; stroke: #f9a8d4; }
.network-node.type-c rect { fill: #eff6ff; stroke: #93c5fd; }
.network-node.type-d rect { fill: #f0fdf4; stroke: #86efac; }
.network-sections { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); gap: .7rem; padding: .65rem 1.25rem 1.1rem; }
.network-group { align-self: start; border: 1px solid #e2e8f0; border-radius: 13px; background: #fff; overflow: hidden; }
.network-group[open] { border-color: #c4b5fd; box-shadow: 0 4px 14px rgba(30,27,75,.06); }
.network-group summary { display: flex; align-items: center; gap: .6rem; padding: .85rem 1rem; cursor: pointer; list-style: none; color: #27235c; font-weight: 700; }
.network-group summary::-webkit-details-marker { display: none; }
.network-group summary::before { content: ''; width: .45rem; height: .45rem; border-right: 2px solid #7c3aed; border-bottom: 2px solid #7c3aed; transform: rotate(-45deg); transition: transform .18s; }
.network-group[open] summary::before { transform: rotate(45deg); }
.network-group-count { margin-left: auto; min-width: 1.45rem; padding: .12rem .38rem; border-radius: 999px; background: #f1f5f9; color: #64748b; text-align: center; font-size: .72rem; }
.network-group p { margin: 0; padding: 0 1rem .75rem 2.35rem; color: #64748b; font-size: .82rem; }
.network-term-list { display: flex; flex-wrap: wrap; gap: .45rem; padding: 0 1rem 1rem; }
.network-term-link { border: 1px solid #e2e8f0; border-radius: 999px; padding: .38rem .65rem; color: #4c1d95; background: #fafaff; font-size: .8rem; font-weight: 600; text-decoration: none; transition: .18s; }
.network-term-link:hover, .network-term-link:focus-visible { border-color: #a78bfa; background: #f5f3ff; box-shadow: 0 2px 8px #7c3aed1c; outline: none; }
.network-note { margin: 0 1.5rem 1.4rem; border-left: 3px solid #a78bfa; background: #faf5ff; padding: .65rem .85rem; color: #5b5671; font-size: .82rem; }
.network-error { padding: 2rem; color: #64748b; text-align: center; }
@media (max-width: 620px) { .network-heading { align-items: flex-start; flex-direction: column; } .network-page { padding: 0 .7rem; } .network-canvas { padding-left: .25rem; padding-right: .25rem; } }
</style>
</head>
<body data-page="redes">
<script src="assets/js/navbar.js"></script>
<header class="network-hero">
  <h1 data-es="Redes conceptuales" data-en="Conceptual networks">Redes conceptuales</h1>
  <p data-es="Explora cómo se relacionan algunos conceptos del glosario. Selecciona un nodo para abrir su ficha." data-en="Explore how glossary concepts relate to one another. Select a node to open its entry.">Explora cómo se relacionan algunos conceptos del glosario. Selecciona un nodo para abrir su ficha.</p>
</header>
<main class="network-page">
  <section class="network-panel" aria-label="Redes conceptuales">
    <nav class="network-tabs" id="network-tabs" aria-label="Temas de la red"></nav>
    <header class="network-heading"><div><h2 id="network-title"></h2><p id="network-description"></p></div><span class="network-help" data-es="Haz clic en un término para abrir su ficha ↗" data-en="Click a term to open its entry ↗">Haz clic en un término para abrir su ficha ↗</span></header>
    <div class="network-canvas" id="network-canvas" aria-live="polite"></div>
    <p class="network-note" id="network-note"></p>
  </section>
</main>
<script src="assets/js/networks.js"></script>
<script src="assets/js/footer.js"></script>
</body>
</html>
